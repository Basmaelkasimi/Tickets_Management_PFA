stages:
  - test
  - build
  - deploy

test_app:
  stage: test
  image: python:3.13-slim

  before_script:
    - pip install --no-cache-dir -r requirements.txt

  script:
    - python -m compileall app.py models.py



build_image:
  stage: build
  image: docker:29-cli

  services:
    - docker:29-dind

  variables:
    DOCKER_TLS_CERTDIR: "/certs"

  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
deploy_eks:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest

  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com

  before_script:
    - >
      aws_sts_output=$(aws sts assume-role-with-web-identity
      --role-arn arn:aws:iam::531689205589:role/GitLabEKSDeployRole
      --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}"
      --web-identity-token "$GITLAB_OIDC_TOKEN"
      --duration-seconds 3600
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
      --output text)
    - export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" $aws_sts_output)
    - aws --version
    - curl -LO "https://dl.k8s.io/release/v1.34.11/bin/linux/amd64/kubectl"
    - install -m 0755 kubectl /usr/local/bin/kubectl
    - kubectl version --client
    - aws sts get-caller-identity
    - aws eks update-kubeconfig --region eu-north-1 --name ticket-management-cluster

  script:
    - kubectl set image deployment/ticket-management ticket-management="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - kubectl rollout status deployment/ticket-management --timeout=300s

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
